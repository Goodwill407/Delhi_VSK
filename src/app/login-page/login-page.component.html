<ngx-spinner bdColor="rgba(51,51,51,0.8)" size="medium" color="#fff" type="ball-scale-multiple">
</ngx-spinner>
<section class="vh-100">
    <div class="container-fluid h-custom">
        <div class="container pt-4" [ngClass]="communicationServiceMobile ? 'd-none' : 'd-block'">
            <div class="row delhi-logos d-flex justify-content-center align-items-center">
                <div class="col-lg-4 col-xl-4 text-end">
                    <img src="../../assets/images/circle.png" width="100" class="img-fluid" alt="Sample image">
                </div>
                <div class="col-lg-4 col-xl-4 text-center">
                    <img src="../../assets/images/vsk_logo.png" class="img-fluid" alt="Sample image">
                </div>
                <div class="col-lg-4 col-xl-4 text-start">
                    <img src="../../assets/images/logossa-removebg-preview.png" width="200" class="img-fluid"
                        alt="Sample image">
                </div>
            </div>
        </div>
        <div class="row d-flex justify-content-center align-items-center">
            <div class="col-md-9 col-lg-6 col-xl-5">
                <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.webp"
                    class="img-fluid" alt="Sample image">
            </div>
            <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1" [ngClass]="communicationServiceMobile ? 'backImg' : 'd-block'">
                                
                <!-- <h3 class="text-center bg-primary text-white p-2 mb-5">Vidya Samiksha Kendra Login</h3> -->
                
                <form [formGroup]="loginForm" (ngSubmit)="submitForm()">

                    <!-- UserName -->
                    <div *ngIf="!OtpFlag">
                    <div  class="form-outline mb-4">
                        <input type="text" id="form3Example3" formControlName="userName"
                            class="form-control form-control-lg" placeholder="Enter UserName" />

                    </div>

                    <!-- Select Role -->
                    <div class="form-outline mb-3" >
                        <select name="" id="" formControlName="Role" class="form-select form-control-lg">
                            <option value="" disable>Select Role</option>
                            <option value="admin">Admin</option>
                            <option value="district">District</option>
                            <option value="zone">Zone</option>
                            <option value="school">School</option>
                        </select>
                    </div>

                    <div class="text-center text-lg-start mt-4 pt-2">
                        <button type="button" class="btn btn-primary btn-lg"
                            style="padding-left: 2.5rem; padding-right: 2.5rem;" (click)="submitForm()">GET OTP</button>
                    </div>

                </div>

                <div *ngIf="OtpFlag">  
               <!-- enter OTP -->
                    <div  class="form-outline mb-3" >
                        <input type="text" id="otp" formControlName="enteredOTP"  placeholder="Enter OTP"
                        class="form-control form-control-lg"/>
                   </div>
                                     
                       <div class="text-center text-lg-start mt-4 pt-2">
                           <button type="button" class="btn btn-primary btn-lg"
                               style="padding-left: 2.5rem; padding-right: 2.5rem;" (click)="verifyOTP()">Verify OTP</button>
                       </div>
                </div>
                            
                </form>
            

                  <div *ngIf="OtpFlag">
                    <form  (ngSubmit)="verifyOTP">
                    <!-- send OTP -->
                  
                    </form>
                </div>
                     

               
            </div>
        </div>
    </div>
</section>
