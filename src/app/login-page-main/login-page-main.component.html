<ngx-spinner bdColor="rgba(51,51,51,0.8)" size="medium" color="#fff" type="ball-scale-multiple">
</ngx-spinner>
<section class="vh-100">
    <div class="container-fluid h-custom">
        <div class="container pt-4" [ngClass]="communicationServiceMobile ? 'd-none' : 'd-block'">
            <div class="row delhi-logos d-flex justify-content-center align-items-center">
                <div class="col-lg-4 col-xl-4 text-end">
                    <img src="../../assets/images/circle.png" width="100" class="img-fluid" alt="Sample image">
                </div>
                <div class="col-lg-4 col-xl-4 text-center">
                    <img src="../../assets/images/vsk_logo.png" class="img-fluid" alt="Sample image">
                </div>
                <!-- <div class="col-lg-4 col-xl-4 text-start">
                    <img src="../../assets/images/bg-sagagra.png" width="200" class="img-fluid"
                        alt="Sample image">
                </div> -->
            </div>
        </div>
        <div class="row d-flex justify-content-center align-items-center">
            <div class="col-md-9 col-lg-6 col-xl-5">
                <img src="../../assets/images/bg-sagagra.png" width="609" height="100%" class="img-fluid"
                        alt="Sample image">
            </div>
            <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1"
                [ngClass]="communicationServiceMobile ? 'backImg' : 'd-block'">

                <!-- <div class="d-flex mb-3">
                    <h5 class="d-flex align-items-center me-2">Select type:</h5>
                    <div class="pe-2">
                        <input type="radio" class="btn-check" name="options-outlined" id="success-outlined"
                            autocomplete="off" value="admin" (change)="loginType($event)" checked>
                        <label class="btn btn-outline-primary" for="success-outlined">Government</label>
                    </div>
                    <div class="ps-2">
                        <input type="radio" class="btn-check" name="options-outlined" id="primary-outlined"
                            autocomplete="off" value="school" (change)="loginType($event)">
                        <label class="btn btn-outline-primary" for="primary-outlined">School</label>
                    </div>
                </div>

                <hr> -->
                <h3 class="text-center bg-primary text-white p-2">Vidya Samiksha Kendra Login</h3>
                <ul class="nav nav-pills mb-3 filter-box px-3 mt-3"
                    [ngClass]="communicationServiceMobile ? 'd-block' : 'd-flex'" id="pills-tab" role="tablist">

                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="pills-home-tab" data-bs-toggle="pill"
                            data-bs-target="#pills-home" type="button" role="tab" aria-controls="pills-home"
                            aria-selected="true">ADMIN</button>
                    </li>

                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="pills-profile-tab" data-bs-toggle="pill"
                            data-bs-target="#pills-profile" type="button" role="tab" aria-controls="pills-profile"
                            aria-selected="false">DEPARTMENT</button>
                    </li>
                </ul>
                <div class="tab-content" id="pills-tabContent">
                    <!-- == 1 == -->
                    <div class="tab-pane fade show active" id="pills-home" role="tabpanel"
                        aria-labelledby="pills-home-tab">
                        <app-login-page (loginFlag)="loginFlagFunc($event)"></app-login-page>
                    </div>

                    <!-- == 2 == -->
                    <div class="tab-pane fade" id="pills-profile" role="tabpanel" aria-labelledby="pills-profile-tab">
                        <app-login-page-otp (loginFlag)="loginFlagFunc($event)"></app-login-page-otp>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</section>
