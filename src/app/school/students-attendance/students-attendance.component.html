<div class="filter-box mt-4 p-3">
    <div class="d-flex align-items-center select-dropdowns">
        <h2 class="fw-bold">Student Attendance</h2>
        <div class="vr mx-3 opacity-100"></div>
        <select class="form-select" [(ngModel)]="classModel" (change)="getAllStudents()">
            <option value="">Select class</option>
            <option *ngFor="let class of allClasses" value="{{class}}">
                {{class}}
            </option>
        </select>
        <select class="form-select ms-3" [(ngModel)]="sectionModel" (change)="getAllStudents()">
            <option value="">Select section</option>
            <option *ngFor="let section of allSections" value="{{section}}">
                {{section}}
            </option>
        </select>
        <input type="date" class="form-control ms-3" [(ngModel)]="dateModel" (change)="getAllStudents()">
    </div>

    <hr>

    <div *ngIf="allStudents && allStudents.length == 0">
        <h5 class="text-center">Please select class, section & date</h5>
    </div>

    <ul class="responsive-table px-2" *ngIf="allStudents && allStudents.length > 0">
        <li class="table-header">
            <div class="col col-3">Name</div>
            <div class="col col-1">Gender</div>
            <div class="col col-1">Attendance</div>
            <div class="col col-3">Remark</div>
        </li>
        <li class="table-row" *ngFor="let student of allStudents">
            <div class="col col-3" data-label="Job Id">{{student.name}}</div>
            <div class="col col-1" data-label="Payment Status">{{student.gender}}</div>
            <div class="col col-1 d-flex" data-label="Payment Status">
                <label class="me-2">Absent</label>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckChecked" checked>
                    Present
                </div>
            </div>
            <div class="col col-3" data-label="Payment Status">
                <input type="text" class="form-control">
            </div>
        </li>
    </ul>
    <div class="d-flex justify-content-end" *ngIf="allStudents && allStudents.length > 0">
        <button class="btn primary-color">Submit Attendance</button>
    </div>
</div>
