<div class="filter-box mt-4 p-3">
    <div class="d-flex">
        <h2 class="fw-bold">Attendance report</h2>
        <div class="vr mx-3 opacity-100"></div>
        <select class="form-select w-25" [(ngModel)]="classModel" (change)="getAllStudents()">
            <option value="">Select class</option>
            <option *ngFor="let class of allClasses" value="{{class}}">
                {{class}}
            </option>
        </select>
        <select class="form-select w-25 ms-3" [(ngModel)]="sectionModel" (change)="getAllStudents()">
            <option value="">Select section</option>
            <option *ngFor="let section of allSections" value="{{section}}">
                {{section}}
            </option>
        </select>
    </div>

    <hr>

    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="home-tab" data-bs-toggle="tab" data-bs-target="#home" type="button"
                role="tab" aria-controls="home" aria-selected="true">Weekly report</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile" type="button"
                role="tab" aria-controls="profile" aria-selected="false">Daily report</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="contact-tab" data-bs-toggle="tab" data-bs-target="#contact" type="button"
                role="tab" aria-controls="contact" aria-selected="false">Student wise report</button>
        </li>
    </ul>
    <div class="tab-content" id="myTabContent">
        <div class="tab-pane fade show active" id="home" role="tabpanel" aria-labelledby="home-tab">
            <apx-chart [series]="chartOptions.series" [chart]="chartOptions.chart"
                [dataLabels]="chartOptions.dataLabels" [plotOptions]="chartOptions.plotOptions"
                [responsive]="chartOptions.responsive" [xaxis]="chartOptions.xaxis" [legend]="chartOptions.legend"
                [fill]="chartOptions.fill"></apx-chart>
        </div>
        <div class="tab-pane fade" id="profile" role="tabpanel" aria-labelledby="profile-tab">
            <div class="row mt-4">
                <div class="col-md-4">
                    <div class="card text-center text-white bg-warning">
                        <h2>70</h2>
                        <h5>Total students</h5>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center text-white bg-success">
                        <h2>64</h2>
                        <h5>Total present</h5>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center text-white bg-danger">
                        <h2>7</h2>
                        <h5>Total absent</h5>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="contact" role="tabpanel" aria-labelledby="contact-tab">
            <ul class="responsive-table px-2 mt-3" *ngIf="allStudents && allStudents.length > 0">
                <li class="table-header">
                    <div class="col col-3">Name</div>
                    <div class="col col-1">Date of Birth</div>
                    <div class="col col-1">Father name</div>
                    <div class="col col-1">Gender</div>
                    <div class="col col-1">Status</div>
                    <div class="col col-3">Action</div>
                </li>
                <li class="table-row" *ngFor="let student of allStudents">
                    <div class="col col-3" data-label="Job Id">{{student.name}}</div>
                    <div class="col col-1" data-label="Customer Name">{{student.dob}}</div>
                    <div class="col col-1" data-label="Amount">{{student.father}}</div>
                    <div class="col col-1" data-label="Payment Status">{{student.gender}}</div>
                    <div class="col col-1" data-label="Payment Status">{{student.status}}</div>
                    <div class="col col-3" data-label="Payment Status">
                        <button class="table-btn-edit" title="View" type="button">View report<i
                                class="bi bi-eye-fill mx-1"></i></button>
                    </div>
                </li>
            </ul>
        </div>
    </div>

</div>
