<ul class="nav nav-pills mb-3 filter-box px-3 mt-3" id="pills-tab" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active" id="pills-home-tab" data-bs-toggle="pill" data-bs-target="#pills-home"
            type="button" role="tab" aria-controls="pills-home" aria-selected="true">ETB coverage status</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="pills-profile-tab" data-bs-toggle="pill" data-bs-target="#pills-profile"
            type="button" role="tab" aria-controls="pills-profile" aria-selected="false">ETB QR coverage</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="pills-course-tab" data-bs-toggle="pill" data-bs-target="#pills-course"
            type="button" role="tab" aria-controls="pills-course" aria-selected="false">ETB learning session</button>
    </li>
</ul>

<div class="tab-content filter-box" id="pills-tabContent">

    <!-- == 1 == -->
    <div class="tab-pane fade show active" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab">
        1
    </div>

    <!-- == 2 == -->
    <div class="tab-pane fade" id="pills-profile" role="tabpanel" aria-labelledby="pills-profile-tab">
        <div class="container1">
            <div class="column">
                <h5 class="header-bg p-2 m-2">QR coverage</h5>
            </div>
        </div>
    </div>

    <!-- == 3 == -->
    <div class="tab-pane fade" id="pills-course" role="tabpanel" aria-labelledby="pills-course-tab">

        <div class="d-flex mt-3 filter-box">
            <!-- <h2 class="fw-bold">Learningsession</h2> -->
            <!-- <div class="vr mx-3 opacity-100"></div> -->
            <select class="form-select w-25 ms-2" [(ngModel)]="subjectModel" >
                <option value="" disabled>Select Subject</option>
                <option  value="">
                    
                </option>
            </select>
            <select class="form-select w-25 ms-2" [(ngModel)]="gradeModel" >
                <option value="" disabled>Select Grade</option>
                <option  value="">
                    
                </option>
            </select>
            <select class="form-select w-25 ms-2"  [(ngModel)]="mediumModel" >
                <option value="" disabled>Select Medium</option>
                <option  value="">
                    
                </option>
            </select>
        </div>
        
        <div class="container1">
            
            <div class="column">
                <h5 class="header-bg p-2 m-2">Total Counts</h5>
                <apx-chart [series]="TotalCountsGraph?.series" [chart]="TotalCountsGraph?.chart"
            [labels]="TotalCountsGraph?.labels" [fill]="TotalCountsGraph?.fill"
            [dataLabels]="TotalCountsGraph?.dataLabels" [plotOptions]="TotalCountsGraph?.plotOptions"
            [responsive]="TotalCountsGraph?.responsive" [legend]="TotalCountsGraph?.legend"></apx-chart>
            </div>

            <div class="column">
                <h5 class="header-bg p-2 m-2">Average No. Of Plays</h5>
                <apx-chart [series]="Average_no_of_playsGraph?.series" [chart]="Average_no_of_playsGraph?.chart"
            [labels]="Average_no_of_playsGraph?.labels" [fill]="Average_no_of_playsGraph?.fill"
            [dataLabels]="Average_no_of_playsGraph?.dataLabels" [plotOptions]="Average_no_of_playsGraph?.plotOptions"
            [responsive]="Average_no_of_playsGraph?.responsive" [legend]="Average_no_of_playsGraph?.legend"></apx-chart>
            </div>

            <div class="column">
                <h5 class="header-bg p-2 m-2">Average Play Time</h5>
                <apx-chart [series]="Average_play_timeGraph?.series" [chart]="Average_play_timeGraph?.chart"
            [labels]="Average_play_timeGraph?.labels" [fill]="Average_play_timeGraph?.fill"
            [dataLabels]="Average_play_timeGraph?.dataLabels" [plotOptions]="Average_play_timeGraph?.plotOptions"
            [responsive]="Average_play_timeGraph?.responsive" [legend]="Average_play_timeGraph?.legend"></apx-chart>
            </div>
    </div>

</div>
