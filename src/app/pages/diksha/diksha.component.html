<ul class="nav nav-pills mb-3 filter-box px-3 mt-3" id="pills-tab" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active" id="pills-home-tab" data-bs-toggle="pill" data-bs-target="#pills-home"
            type="button" role="tab" aria-controls="pills-home" aria-selected="true">ETB coverage status</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="pills-profile-tab" data-bs-toggle="pill" data-bs-target="#pills-profile"
            type="button" role="tab" aria-controls="pills-profile" aria-selected="false">ETB QR coverage</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="pills-course-tab" data-bs-toggle="pill" data-bs-target="#pills-course"
            type="button" role="tab" aria-controls="pills-course" aria-selected="false">ETB learning session</button>
    </li>
</ul>

<div class="tab-content filter-box" id="pills-tabContent">

    <!-- == 1 == -->
    <div class="tab-pane fade show active" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab">
        <div class="d-flex mt-3 filter-box">
            <select class="form-select w-25 ms-2" [(ngModel)]="gradeModel"
                (change)="getAllAverageQRCodeCoverageStatus()">
                <option value="" disabled>Select Grade</option>
                <option *ngFor="let grade of allGrade" value="{{grade}}">
                    {{grade}}
                </option>
            </select>
            <select class="form-select w-25 ms-2" [(ngModel)]="mediumModel"
                (change)="getAllAverageQRCodeCoverageStatus()">
                <option value="" disabled>Select Medium</option>
                <option *ngFor="let medium of allMedium" value="{{medium}}">
                    {{medium}}
                </option>
            </select>
        </div>
        <div class="container1" *ngIf="allQRCodeCoverageStatus?.length > 0">
            <div class="column">
                <h5 class="header-bg p-2 m-2">Average Linked QR Count</h5>
                <apx-chart [series]="averageLinkedQRCountGraph?.series" [chart]="averageLinkedQRCountGraph?.chart"
                    [dataLabels]="averageLinkedQRCountGraph?.dataLabels"
                    [plotOptions]="averageLinkedQRCountGraph?.plotOptions" [xaxis]="averageLinkedQRCountGraph?.xaxis"
                    [legend]="averageLinkedQRCountGraph?.legend"></apx-chart>
            </div>
            <div class="column">
                <h5 class="header-bg p-2 m-2">Average Resource Count</h5>
                <apx-chart [series]="averageResourceCountGraph?.series" [chart]="averageResourceCountGraph?.chart"
                    [dataLabels]="averageResourceCountGraph?.dataLabels"
                    [plotOptions]="averageResourceCountGraph?.plotOptions" [xaxis]="averageResourceCountGraph?.xaxis"
                    [legend]="averageResourceCountGraph?.legend"></apx-chart>
            </div>
        </div>
    </div>

    <!-- == 2 == -->
    <div class="tab-pane fade" id="pills-profile" role="tabpanel" aria-labelledby="pills-profile-tab">
        <div class="d-flex mt-3 filter-box">
            <select class="form-select w-25 ms-2" [(ngModel)]="gradeModel" (change)="getAllAverageQRCodeCoverage()">
                <option value="" disabled>Select Grade</option>
                <option *ngFor="let grade of allGrade" value="{{grade}}">
                    {{grade}}
                </option>
            </select>
            <select class="form-select w-25 ms-2" [(ngModel)]="mediumModel" (change)="getAllAverageQRCodeCoverage()">
                <option value="" disabled>Select Medium</option>
                <option *ngFor="let medium of allMedium" value="{{medium}}">
                    {{medium}}
                </option>
            </select>
        </div>

        <div class="container1" *ngIf="allQRCodeCoverage?.length > 0">
            <div class="column">
                <h5 class="header-bg p-2 m-2">Average QR Code Coverage</h5>
                <apx-chart [series]="averageQRCodeCoverageGraph?.series" [chart]="averageQRCodeCoverageGraph?.chart"
                    [dataLabels]="averageQRCodeCoverageGraph?.dataLabels"
                    [plotOptions]="averageQRCodeCoverageGraph?.plotOptions" [xaxis]="averageQRCodeCoverageGraph?.xaxis"
                    [legend]="averageQRCodeCoverageGraph?.legend"></apx-chart>
            </div>
            <div class="column">
                <h5 class="header-bg p-2 m-2">Average QR Code Linked Content</h5>
                <apx-chart [series]="averageQRCodeCoverageGraph?.series" [chart]="averageQRCodeCoverageGraph?.chart"
                    [dataLabels]="averageQRCodeCoverageGraph?.dataLabels"
                    [plotOptions]="averageQRCodeCoverageGraph?.plotOptions" [xaxis]="averageQRCodeCoverageGraph?.xaxis"
                    [legend]="averageQRCodeCoverageGraph?.legend"></apx-chart>
            </div>
            <div class="column">
                <h5 class="header-bg p-2 m-2">Average Total QR Code</h5>
                <apx-chart [series]="averageQRCodeCoverageGraph?.series" [chart]="averageQRCodeCoverageGraph?.chart"
                    [dataLabels]="averageQRCodeCoverageGraph?.dataLabels"
                    [plotOptions]="averageQRCodeCoverageGraph?.plotOptions" [xaxis]="averageQRCodeCoverageGraph?.xaxis"
                    [legend]="averageQRCodeCoverageGraph?.legend"></apx-chart>
            </div>
        </div>
    </div>

    <!-- == 3 == -->
    <div class="tab-pane fade" id="pills-course" role="tabpanel" aria-labelledby="pills-course-tab">

        <div class="d-flex mt-3 filter-box">
            <select class="form-select w-25 ms-2" [(ngModel)]="gradeModel" (change)="getAllCounts_learningsession()">
                <option value="" disabled>Select Grade</option>
                <option *ngFor="let grade of allGrade" value="{{grade}}">
                    {{grade}}
                </option>
            </select>
            <select class="form-select w-25 ms-2" [(ngModel)]="mediumModel" (change)="getAllCounts_learningsession()">
                <option value="" disabled>Select Medium</option>
                <option *ngFor="let medium of allMedium" value="{{medium}}">
                    {{medium}}
                </option>
            </select>
            <select class="form-select w-25 ms-2" [(ngModel)]="subjectModel" (change)="getAllCounts_learningsession()">
                <option value="" disabled>Select Subject</option>
                <option *ngFor="let subject of allSubjects" value="{{subject}}">
                    {{subject}}
                </option>
            </select>
        </div>

        <div class="container1">
            <div class="column">
                <h5 class="header-bg p-2 m-2">Total Counts</h5>
                <apx-chart [series]="TotalCountsGraph?.series" [chart]="TotalCountsGraph?.chart"
                    [labels]="TotalCountsGraph?.labels" [fill]="TotalCountsGraph?.fill"
                    [dataLabels]="TotalCountsGraph?.dataLabels" [plotOptions]="TotalCountsGraph?.plotOptions"
                    [responsive]="TotalCountsGraph?.responsive" [legend]="TotalCountsGraph?.legend"></apx-chart>
            </div>

            <div class="column">
                <h5 class="header-bg p-2 m-2">Average No. Of Plays</h5>
                <apx-chart [series]="Average_no_of_playsGraph?.series" [chart]="Average_no_of_playsGraph?.chart"
                    [labels]="Average_no_of_playsGraph?.labels" [fill]="Average_no_of_playsGraph?.fill"
                    [dataLabels]="Average_no_of_playsGraph?.dataLabels"
                    [plotOptions]="Average_no_of_playsGraph?.plotOptions"
                    [responsive]="Average_no_of_playsGraph?.responsive"
                    [legend]="Average_no_of_playsGraph?.legend"></apx-chart>
            </div>

            <div class="column">
                <h5 class="header-bg p-2 m-2">Average Play Time</h5>
                <apx-chart [series]="Average_play_timeGraph?.series" [chart]="Average_play_timeGraph?.chart"
                    [labels]="Average_play_timeGraph?.labels" [fill]="Average_play_timeGraph?.fill"
                    [dataLabels]="Average_play_timeGraph?.dataLabels"
                    [plotOptions]="Average_play_timeGraph?.plotOptions"
                    [responsive]="Average_play_timeGraph?.responsive"
                    [legend]="Average_play_timeGraph?.legend"></apx-chart>
            </div>
        </div>

    </div>
