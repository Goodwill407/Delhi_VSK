<div class="container1">
  <div class="column text-center">
    <h5 class="bg-light p-2 m-2">Total Teacher</h5>
    <div class="d-flex mt-5 justify-content-around">
      <div class="teacher-info">
        <h1 class="fw-bold">{{totalTeacher}}</h1>
        <h5>Total Teacher</h5>
      </div>
      <div class="vr"></div>
      <div class="teacher-info">
        <h1 class="fw-bold">{{averageTeacherOfSchool.toFixed(1)}}</h1>
        <h5>Average Teacher</h5>
      </div>
    </div>
  </div>


  <div class="column text-center">
    <h5 class="bg-light p-2 m-2">Teachers per Students Ratio</h5>
    <img class="img-fluid mt-4" width="150" src="../../../assets/images/pngegg.png">
    <h5 class="mt-3 fw-bold">1 Teacher per {{teachersRatio}} Students</h5>
  </div>

  <div class="column">
    <h5 class="bg-light p-2 m-2">Teachers Gender Ratio</h5>
    <apx-chart [series]="teacherGenderRatio?.series" [chart]="teacherGenderRatio?.chart"
      [dataLabels]="teacherGenderRatio?.dataLabels" [plotOptions]="teacherGenderRatio?.plotOptions"
      [yaxis]="teacherGenderRatio?.yaxis" [xaxis]="teacherGenderRatio?.xaxis" [legend]="teacherGenderRatio?.legend"
      [colors]="teacherGenderRatio?.colors" [grid]="teacherGenderRatio?.grid"></apx-chart>
  </div>

  <div class="column">
    <h5 class="mb-0">Types Of Teacher </h5>
    <apx-chart [series]="teacherGenderRatio?.series" [chart]="teacherGenderRatio?.chart"
      [dataLabels]="teacherGenderRatio?.dataLabels" [plotOptions]="teacherGenderRatio?.plotOptions"
      [yaxis]="teacherGenderRatio?.yaxis" [xaxis]="teacherGenderRatio?.xaxis" [legend]="teacherGenderRatio?.legend"
      [colors]="teacherGenderRatio?.colors" [grid]="teacherGenderRatio?.grid"></apx-chart>
  </div>

  <div class="column">
    <h5 class="bg-light p-2 m-2">Teachers Gender Ratio</h5>
    <apx-chart
    [series]="commonPieChart.series"
    [chart]="commonPieChart.chart"
    [labels]="commonPieChart.labels"
    [responsive]="commonPieChart.responsive"
  ></apx-chart>
  </div>
  <div class="column">
    <h5 class="mb-0">Shift wise Schools</h5>
    <apx-chart [series]="teacherGenderRatio?.series" [chart]="teacherGenderRatio?.chart"
      [dataLabels]="teacherGenderRatio?.dataLabels" [plotOptions]="teacherGenderRatio?.plotOptions"
      [yaxis]="teacherGenderRatio?.yaxis" [xaxis]="teacherGenderRatio?.xaxis" [legend]="teacherGenderRatio?.legend"
      [colors]="teacherGenderRatio?.colors" [grid]="teacherGenderRatio?.grid"></apx-chart>
  </div>
</div>
