<ngx-spinner bdColor="rgba(51,51,51,0.8)" size="medium" color="#fff" type="ball-scale-multiple">
</ngx-spinner>

<!-- <div class="tab-content mt-3" id="pills-tabContent">
  <div class="tab-pane fade show active" id="government" role="tabpanel" aria-labelledby="pills-home-tab"> -->
<!-- Teacher Guest and Regular -->
<ul class="nav nav-pills mb-3 filter-box px-3 mt-3" id="pills-tab" role="tablist">
  <h2 class="fw-bold mb-0">TEACHER </h2>
  <div class="vr mx-3 opacity-100" [ngClass]="communicationServiceMobile ? 'd-none' : 'd-block'"></div>
  <li class="nav-item" role="presentation" [ngClass]="communicationServiceMobile ? 'ms-2' : ''">
    <button class="nav-link active" id="pills-home-tab" data-bs-toggle="pill" data-bs-target="#pills-home" type="button"
      role="tab" aria-controls="pills-home" aria-selected="true" (click)="handleParentClick('total')">TOTAL
      TEACHERS</button>
  </li>
  <li class="nav-item" role="presentation">
    <button class="nav-link" id="pills-regular-tab" data-bs-toggle="pill" data-bs-target="#pills-regular" type="button"
      role="tab" aria-controls="pills-regular" aria-selected="false" (click)="handleParentClick('regular')">REGULAR
      TEACHERS</button>
  </li>
  <li class="nav-item" role="presentation">
    <button class="nav-link" id="pills-profile-tab" data-bs-toggle="pill" data-bs-target="#pills-profile" type="button"
      role="tab" aria-controls="pills-profile" aria-selected="false" (click)="handleParentClick('guest')">GUEST
      TEACHERS</button>
  </li>
</ul>

<div class="tab-content" id="pills-tabContent">
  <!-- == REGULAR TEACHER CODE == -->
  <div class="tab-pane fade show active" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab">
    <app-total-teacher></app-total-teacher>
  </div>

  <!-- == Regular TEACHER CODE == -->
  <div class="tab-pane fade" id="pills-regular" role="tabpanel" aria-labelledby="pills-regular-tab">
    <app-regular-teacher></app-regular-teacher>
  </div>
 
  <!-- == GUEST TEACHER CODE == -->
  <div class="tab-pane fade" id="pills-profile" role="tabpanel" aria-labelledby="pills-profile-tab">
    <app-teacher-guest></app-teacher-guest>
  </div>
</div>
