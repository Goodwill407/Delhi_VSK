<ngx-spinner bdColor="rgba(51,51,51,0.8)" size="medium" color="#fff" type="ball-scale-multiple">
</ngx-spinner>
<div class="d-flex mt-3 filter-box">
    <h2 class="fw-bold">UDISE SCHOOL</h2>
</div>

<div class="container1">
    <div class="column">
        <h5 class="header-bg p-2 m-2">Delhi</h5>
        <div class="d-block ms-1 text-center">
            <h1 class="fw-bold">{{TotalSchool}}</h1>
            <h4 class="fw-bold">Total School</h4>

        </div>
    </div>

    <div class="column">
        <h5 class="header-bg p-2 m-2">Rural Urban Counts</h5>
        <apx-chart [series]="RuralUrbanCountsGraph?.series" [chart]="RuralUrbanCountsGraph?.chart"
            [labels]="RuralUrbanCountsGraph?.labels" [fill]="RuralUrbanCountsGraph?.fill"
            [dataLabels]="RuralUrbanCountsGraph?.dataLabels" [plotOptions]="RuralUrbanCountsGraph?.plotOptions"
            [responsive]="RuralUrbanCountsGraph?.responsive" [legend]="RuralUrbanCountsGraph?.legend"></apx-chart>
    </div>

    <div class="column">
        <h5 class="header-bg p-2 m-2">Delhi</h5>
    </div>
</div>
