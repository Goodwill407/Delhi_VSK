<ngx-spinner bdColor="rgba(51,51,51,0.8)" size="medium" color="#fff" type="ball-scale-multiple">
</ngx-spinner>
<!-- Dropdowns -->
<div class="d-flex mt-3 filter-box">
    <h2 class="fw-bold mb-0 p-1">School</h2>
    <div class="vr mx-3 opacity-100"></div>
    <select class="form-select w-25 ms-2" [(ngModel)]="districtModel" (change)="getGraphsByDistrictName()">
        <option value="">All Districts</option>
        <option *ngFor="let district of allDistricts" value="{{district.districtName}}">
            {{district.districtName}}
        </option>
    </select>
    <select class="form-select w-25 ms-2" [(ngModel)]="zoneModel" (change)="getGraphsByZone()">
        <option value="" disabled>All Zones</option>
        <option *ngFor="let zone of allZones" value="{{zone.Zone_Name}}">
            Zone -{{zone.Zone_Name}}
        </option>
    </select>
    <!-- <select class="form-select w-25 ms-2" [(ngModel)]="schoolModel" (change)="getGraphsBySchoolName()">
        <option value="" disabled>Select Schools</option>
        <option *ngFor="let school of allSchools" [ngValue]="school">
            {{school.SchName}} ({{school.SchoolID}})
        </option>
    </select> -->
</div>
<div class="container1">
    <div class="column text-center">
        <h5 class="header-bg p-2">Udise Total School</h5>
        <div class="mt-4">
            <img class="ms-2" src="../../../assets/images/icons/school-2.png" style="height: 120px;" alt="">
        </div>
        <h1 class="fw-bold mt-4">{{TotalSchool}}</h1>
        <h3>Total schools</h3>
    </div>

    <div class="column">
        <h5 class="header-bg p-2">Rural Urban Count</h5>
        <apx-chart [series]="RuralUrbanCountsGraph?.series" [chart]="RuralUrbanCountsGraph?.chart"
            [labels]="RuralUrbanCountsGraph?.labels" [fill]="RuralUrbanCountsGraph?.fill"
            [colors]="RuralUrbanCountsGraph?.colors" [dataLabels]="RuralUrbanCountsGraph?.dataLabels"
            [plotOptions]="RuralUrbanCountsGraph?.plotOptions" [responsive]="RuralUrbanCountsGraph?.responsive"
            [legend]="RuralUrbanCountsGraph?.legend"></apx-chart>
    </div>

    <div class="column">
        <h5 class="header-bg p-2">School Gender Wise Count</h5>
        <apx-chart [series]="SchoolGenderCountsGraph?.series" [chart]="SchoolGenderCountsGraph?.chart"
            [labels]="SchoolGenderCountsGraph?.labels" [fill]="SchoolGenderCountsGraph?.fill"
            [colors]="SchoolGenderCountsGraph?.colors" [dataLabels]="SchoolGenderCountsGraph?.dataLabels"
            [plotOptions]="SchoolGenderCountsGraph?.plotOptions" [responsive]="SchoolGenderCountsGraph?.responsive"
            [legend]="RuralUrbanCountsGraph?.legend"></apx-chart>
    </div>

    <div class="column">
        <h5 class="header-bg p-2">School Shift Wise Count</h5>
        <apx-chart [series]="ShiftfSchoolCountsGraph?.series" [chart]="ShiftfSchoolCountsGraph?.chart"
            [labels]="ShiftfSchoolCountsGraph?.labels" [fill]="ShiftfSchoolCountsGraph?.fill"
            [colors]="ShiftfSchoolCountsGraph?.colors" [dataLabels]="ShiftfSchoolCountsGraph?.dataLabels"
            [plotOptions]="ShiftfSchoolCountsGraph?.plotOptions" [responsive]="ShiftfSchoolCountsGraph?.responsive"
            [legend]="RuralUrbanCountsGraph?.legend"></apx-chart>
    </div>

    <div class="column">
        <h5 class="header-bg p-2">School Type Wise Count</h5>
        <apx-chart [series]="TypeofSchoolCountsGraph?.series" [chart]="TypeofSchoolCountsGraph?.chart"
            [labels]="TypeofSchoolCountsGraph?.labels" [fill]="TypeofSchoolCountsGraph?.fill"
            [colors]="TypeofSchoolCountsGraph?.colors" [dataLabels]="TypeofSchoolCountsGraph?.dataLabels"
            [plotOptions]="TypeofSchoolCountsGraph?.plotOptions" [responsive]="TypeofSchoolCountsGraph?.responsive"
            [legend]="RuralUrbanCountsGraph?.legend"></apx-chart>
    </div>

</div>
