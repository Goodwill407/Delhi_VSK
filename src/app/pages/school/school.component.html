<div class="container1">
    <div class="column">
        <h5 class="bg-light p-2 m-2">Central District</h5>
        <div class="d-flex">
            <div>
                <h1 class="fw-bold">{{totalSchools}}</h1>
                <h3>Total schools</h3>
            </div>
            <div class="vr"></div>
            <div></div>
        </div>
    </div>
    <div class="column text-center">
        <h5 class="mb-0">Teachers per Students Ratio</h5>
        <img class="img-fluid mt-4" width="150" src="../../../assets/images/pngegg.png">
        <h5 class="mt-3 fw-bold">1 Teacher per {{teachersRatio}} Students</h5>
    </div>
    <div class="column">
        <h5 class="mb-0">Students Gender Ratio</h5>
        <apx-chart [series]="studentsGenderRatio?.series" [chart]="studentsGenderRatio?.chart"
            [dataLabels]="studentsGenderRatio?.dataLabels" [plotOptions]="studentsGenderRatio?.plotOptions"
            [yaxis]="studentsGenderRatio?.yaxis" [xaxis]="studentsGenderRatio?.xaxis"
            [legend]="studentsGenderRatio?.legend" [colors]="studentsGenderRatio?.colors"
            [grid]="studentsGenderRatio?.grid"></apx-chart>
    </div>
    <div class="column">
        <h5 class="mb-0">Teachers Gender Ratio</h5>
        <apx-chart [series]="teacherGenderRatio?.series" [chart]="teacherGenderRatio?.chart"
            [dataLabels]="teacherGenderRatio?.dataLabels" [plotOptions]="teacherGenderRatio?.plotOptions"
            [yaxis]="teacherGenderRatio?.yaxis" [xaxis]="teacherGenderRatio?.xaxis"
            [legend]="teacherGenderRatio?.legend" [colors]="teacherGenderRatio?.colors"
            [grid]="teacherGenderRatio?.grid"></apx-chart>
    </div>
    <div class="column">
        <h5 class="mb-0">Types of Schools</h5>
        <apx-chart [series]="typesOfSchools?.series" [chart]="typesOfSchools?.chart" [labels]="typesOfSchools?.labels"
            [fill]="typesOfSchools?.fill" [dataLabels]="typesOfSchools?.dataLabels"
            [plotOptions]="typesOfSchools?.plotOptions" [responsive]="typesOfSchools?.responsive"></apx-chart>
    </div>
    <div class="column">
        <h5 class="mb-0">Shift wise Schools</h5>
        <apx-chart [series]="shiftWiseSchools?.series" [chart]="shiftWiseSchools?.chart"
            [dataLabels]="shiftWiseSchools?.dataLabels" [plotOptions]="shiftWiseSchools?.plotOptions"
            [yaxis]="shiftWiseSchools?.yaxis" [xaxis]="shiftWiseSchools?.xaxis" [legend]="shiftWiseSchools?.legend"
            [colors]="shiftWiseSchools?.colors" [grid]="shiftWiseSchools?.grid"></apx-chart>
    </div>
</div>
