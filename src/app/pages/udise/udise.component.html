<ngx-spinner bdColor="rgba(51,51,51,0.8)" size="medium" color="#fff" type="ball-scale-multiple">
</ngx-spinner>
<div class="mt-2 filter-box d-flex">
    <h2 class="fw-bold">UDISE</h2>
    <div class="vr mx-3 opacity-100"></div>
    <h3>Unified District Information System for Education</h3>
</div>
<ul class="nav nav-pills mb-3 filter-box px-3 mt-3" id="pills-tab" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active" id="pills-home-tab" data-bs-toggle="pill" data-bs-target="#pills-home"
            type="button" role="tab" aria-controls="pills-home" aria-selected="true"
            (click)="handleParentClick('home')">HOME</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="pills-profile-tab" data-bs-toggle="pill" data-bs-target="#pills-profile"
            type="button" role="tab" aria-controls="pills-profile" aria-selected="false"
            (click)="handleParentClick('udise')">UDISE</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="pills-tabular-tab" data-bs-toggle="pill" data-bs-target="#pills-tabular"
            type="button" role="tab" aria-controls="pills-tabular" aria-selected="false"
            (click)="handleParentClick('udise-school')">UDISE SCHOOLS</button>
    </li>
</ul>

<div class="tab-content" id="pills-tabContent">

    <!-- == 1 == -->
    <div class="tab-pane fade show active" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab">
        <app-udise-home></app-udise-home>
    </div>
    
    <!-- == 2 == -->
    <div class="tab-pane fade" id="pills-profile" role="tabpanel" aria-labelledby="pills-profile-tab">
        <app-udise-data></app-udise-data>
    </div>
    
    <!-- == 3 == -->
    <div class="tab-pane fade" id="pills-tabular" role="tabpanel" aria-labelledby="pills-tabular-tab">
        <app-udise-school></app-udise-school>
    </div>
</div>
