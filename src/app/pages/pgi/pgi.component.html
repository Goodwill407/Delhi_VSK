<ngx-spinner bdColor="rgba(51,51,51,0.8)" size="medium" color="#fff" type="ball-scale-multiple">
</ngx-spinner>
<div class="d-flex mt-3 filter-box">
    <h2 class="fw-bold">PERFORMANCE GRADING INDEX (PGI)</h2>
</div>
<div class="container1">
    <div class="column wide">
        <h5 class="header-bg p-2">Outcome</h5>
        <apx-chart [series]="outcomeGraph?.series" [chart]="outcomeGraph?.chart" [dataLabels]="outcomeGraph?.dataLabels"
            [plotOptions]="outcomeGraph?.plotOptions" [xaxis]="outcomeGraph?.xaxis" [yaxis]="outcomeGraph?.yaxis"
            [labels]="outcomeGraph?.labels" [legend]="outcomeGraph?.legend" [colors]="outcomeGraph?.colors"
            [grid]="outcomeGraph?.grid"></apx-chart>
    </div>

    <div class="column wide">
        <h5 class="header-bg p-2">Effective Classroom Transaction</h5>
        <apx-chart [series]="classroomTransaction?.series" [chart]="classroomTransaction?.chart"
            [dataLabels]="classroomTransaction?.dataLabels" [plotOptions]="classroomTransaction?.plotOptions"
            [xaxis]="classroomTransaction?.xaxis" [yaxis]="classroomTransaction?.yaxis"
            [labels]="classroomTransaction?.labels" [legend]="classroomTransaction?.legend"
            [colors]="classroomTransaction?.colors" [grid]="classroomTransaction?.grid"
            [stroke]="classroomTransaction?.stroke"></apx-chart>
    </div>

    <div class="column wide">
        <h5 class="header-bg p-2">School safety and child protection</h5>
        <apx-chart [series]="schoolSafetyAndChildProtection?.series" [chart]="schoolSafetyAndChildProtection?.chart"
            [dataLabels]="schoolSafetyAndChildProtection?.dataLabels"
            [plotOptions]="schoolSafetyAndChildProtection?.plotOptions" [xaxis]="schoolSafetyAndChildProtection?.xaxis"
            [yaxis]="schoolSafetyAndChildProtection?.yaxis" [labels]="schoolSafetyAndChildProtection?.labels"
            [legend]="schoolSafetyAndChildProtection?.legend" [colors]="schoolSafetyAndChildProtection?.colors"
            [grid]="schoolSafetyAndChildProtection?.grid"></apx-chart>
    </div>

    <div class="column wide">
        <h5 class="header-bg p-2">Digital learning</h5>
        <apx-chart [series]="digitalLearning?.series" [chart]="digitalLearning?.chart"
            [dataLabels]="digitalLearning?.dataLabels" [plotOptions]="digitalLearning?.plotOptions"
            [xaxis]="digitalLearning?.xaxis" [yaxis]="digitalLearning?.yaxis" [labels]="digitalLearning?.labels"
            [legend]="digitalLearning?.legend" [colors]="digitalLearning?.colors"
            [grid]="digitalLearning?.grid"></apx-chart>
    </div>

    <div class="column wide">
        <h5 class="header-bg p-2">Governance processes</h5>
        <apx-chart [series]="governanceProcesses?.series" [chart]="governanceProcesses?.chart"
            [dataLabels]="governanceProcesses?.dataLabels" [plotOptions]="governanceProcesses?.plotOptions"
            [xaxis]="governanceProcesses?.xaxis" [yaxis]="governanceProcesses?.yaxis"
            [labels]="governanceProcesses?.labels" [legend]="governanceProcesses?.legend"
            [colors]="governanceProcesses?.colors" [grid]="governanceProcesses?.grid"
            [stroke]="governanceProcesses?.stroke"></apx-chart>
    </div>
</div>
