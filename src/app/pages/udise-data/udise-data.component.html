<ngx-spinner bdColor="rgba(51,51,51,0.8)" size="medium" color="#fff" type="ball-scale-multiple">
</ngx-spinner>

<ul class="nav nav-pills mb-3 filter-box px-3 mt-3" id="pills-tab" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active d-flex align-items-center" (click)="setGraphData('totalSchoolsToilet')"
            data-bs-toggle="pill" type="button" role="tab" aria-controls="pills-home" aria-selected="true"><img
                src="../../../assets/images/icons/toilet.png" width="30"><span class="ms-2">Toilets</span></button>
    </li>
    <li class="nav-item d-flex align-items-center" role="presentation">
        <button class="nav-link" (click)="setGraphData('drinkingWater')" data-bs-toggle="pill" type="button" role="tab"
            aria-controls="pills-profile" aria-selected="false"><img src="../../../assets/images/icons/water-tap.png"
                width="30"><span class="ms-2">Drinking water</span></button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" (click)="setGraphData('electricity')" data-bs-toggle="pill" type="button" role="tab"
            aria-controls="pills-profile" aria-selected="false">Electricity</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" (click)="setGraphData('library')" data-bs-toggle="pill" type="button" role="tab"
            aria-controls="pills-profile" aria-selected="false">Library</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" (click)="setGraphData('textbook')" data-bs-toggle="pill" type="button" role="tab"
            aria-controls="pills-profile" aria-selected="false">
            Textbook</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" (click)="setGraphData('ramp')" data-bs-toggle="pill" type="button" role="tab"
            aria-controls="pills-profile" aria-selected="false">Ramp</button>
    </li>
</ul>

<div class="container1">
    <div class="column wide">
        <h5 class="header-bg p-2 m-2">{{graphType}}</h5>
        <apx-chart [series]="totalSchoolsData?.series" [chart]="totalSchoolsData?.chart"
            [dataLabels]="totalSchoolsData?.dataLabels" [plotOptions]="totalSchoolsData?.plotOptions"
            [xaxis]="totalSchoolsData?.xaxis" [yaxis]="totalSchoolsData?.yaxis" [labels]="totalSchoolsData?.labels"
            [legend]="totalSchoolsData?.legend" [colors]="totalSchoolsData?.colors"
            [grid]="totalSchoolsData?.grid"></apx-chart>
    </div>
</div>
