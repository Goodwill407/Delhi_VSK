<ngx-spinner bdColor="rgba(51,51,51,0.8)" size="medium" color="#fff" type="ball-scale-multiple">
</ngx-spinner>

<div class="d-flex mt-2 mt-4 filter-box">
    <h2 class="fw-bold"> National Achievement Survey (NAS) </h2>
</div>
<div class="d-flex mt-2 filter-box">
    <!-- <div class="vr mx-3 opacity-100"></div> -->
    <select class="form-select w-25 ms-2" [(ngModel)]="gradeModel" >
        <option value="">All District</option>
        <option *ngFor="let district of allDistricts" value="{{district._id}}">
            {{district._id}}
        </option>
    </select>
    <select class="form-select w-25 ms-2" [(ngModel)]="subjectModel" >
        <option value="">All Zones</option>
        <option *ngFor="let zone of allZones" value="{{zone}}">
            {{zone}}
        </option>
    </select>
    <select class="form-select w-25 ms-2" [(ngModel)]="shiftModel" >
        <option value="" disabled>Select Shift</option>
        <option *ngFor="let shift of allShift" value="{{shift}}">
            {{shift}}
        </option>
    </select>
</div>

<div class="d-flex justify-content-center filter-box mt-2" *ngIf="gradeModel || subjectModel || shiftModel">
    <h3 class="text-center mb-0" *ngIf="gradeModel && !shiftModel"> <span>|</span> &nbsp;{{gradeModel}}&nbsp;
    </h3>
    <h3 class="text-center mb-0" *ngIf="subjectModel && !shiftModel"> <span *ngIf="gradeModel">|</span>
        {{subjectModel}}&nbsp; </h3>
    <h3 class="text-center mb-0" *ngIf="shiftModel"> <span>|</span> {{shiftModel}}</h3>
</div>


<div class="container1">

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Outcome</th>
                <th>Grade</th>
                <th>Subject</th>
                <th *ngFor="let data of allTableData">
                    {{data.district_name}}
                </th>
            </tr>
        </thead>
        <tbody>
            <!-- <tr *ngFor="let data of allTableData">
                <td>{{data.learning_outcome_code}}</td>
                <td>{{data.grade}}</td>
                <td>{{data.subject}}</td>
                <td *ngFor="let data of allTableData">{{data.performance | number:'1.1-2' }}</td>
            </tr> -->
            <tr *ngFor="let data of allData">
                <td>{{data.learning_outcome_code}}</td>
                <td>{{data.grade}}</td>
                <td>{{data.subject}}</td>
                <td *ngFor="let data of allData">{{data.performance | number:'1.1-2' }}</td>
            </tr>
                
                
                <!-- <td>
                    {{data.learning_outcome_code}}
                </td>
            </tr> -->
        </tbody>
    </table>

</div>
